version: 2

models:
  - name: mart_customer
    description: "Customer-level golden datamart combining customer profile, account summary, and loan summary."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - position_date
              - customer_id
    columns:
      - name: position_date
        tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('acl_customers')
                field: customer_id
      - name: age
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
                max_value: 120
      - name: tenure_months
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: total_accounts
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: total_loans
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: total_account_balance
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: total_outstanding_loan_balance
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: is_account_holder
        tests:
          - accepted_values:
              arguments: 
                values: [0, 1]
                quote: false
      - name: is_borrower
        tests:
          - accepted_values:
              arguments: 
                values: [0, 1]
                quote: false
      - name: is_financially_active
        tests:
          - accepted_values:
              arguments: 
                values: [0, 1]
                quote: false
