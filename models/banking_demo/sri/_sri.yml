version: 2

models:
  - name: sri_customers
    description: "Cleaned and standardized customers data."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - position_date
              - customer_id
    columns:
      - name: position_date
        tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments: 
                values: ['MALE', 'FEMALE']
      - name: kyc_status
        tests:
          - not_null

  - name: sri_accounts
    description: "Cleaned and standardized accounts data."
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - position_date
              - account_id

    columns:
      - name: position_date
        tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('sri_customers')
                field: customer_id
      - name: balance
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: account_status
        tests:
          - accepted_values:
              arguments: 
                values:
                  - ACTIVE
                  - DORMANT
                  - CLOSED

  - name: sri_loans
    description: "Cleaned and standardized loans data."
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - position_date
              - loan_id

    columns:
      - name: position_date
        tests:
          - not_null
      - name: loan_id
        data_tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('sri_customers')
                field: customer_id
      - name: loan_status
        tests:
          - accepted_values:
              arguments: 
                values:
                  - CLOSED
                  - CURRENT
                  - DELINQUENT
                  - RESTRUCTURED
      - name: principal_amount
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: outstanding_balance
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
      - name: interest_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
                max_value: 100
      - name: tenor_months
        tests:
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 1