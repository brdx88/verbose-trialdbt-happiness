version: 2

models:
  - name: stg_properties
    description: "Cleaned and standardized properties data from raw source."
    columns:
      - name: property_id
        description: "Unique identifier for each property."
        tests:
          - unique
          - not_null

      - name: property_name
        tests:
          - not_null

      - name: lease_start_date
        tests:
          - not_null

      - name: lease_end_date
        tests:
          - not_null

      - name: is_active
        tests:
          - not_null

  - name: stg_rooms
    description: "Cleaned and standardized rooms data from raw source."
    columns:
      - name: room_id
        description: "Unique identifier for each room."
        tests:
          - unique
          - not_null

      - name: property_id
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_properties')
                field: property_id

      - name: is_active
        tests:
          - not_null

  - name: stg_tenancies
    description: "Cleaned and standardized tenancies data from raw source."
    columns:
      - name: tenancy_id
        description: "Unique identifier for each tenancy."
        tests:
          - unique
          - not_null

      - name: room_id
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_rooms')
                field: room_id

      - name: check_in_date
        tests:
          - not_null

      - name: check_out_date
        tests:
          - not_null

      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['ACTIVE', 'CANCELLED']