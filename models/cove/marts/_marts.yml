version: 2

models:
  - name: fct_occupancy_monthly
    description: "Monthly occupancy rate per property. One row per property per month."
    columns:
      - name: month_start
        description: "First day of the month."
        tests:
          - not_null

      - name: property_id
        tests:
          - not_null

      - name: property_name
        tests:
          - not_null

      - name: available_room_nights
        tests:
          - not_null

      - name: occupied_room_nights
        tests:
          - not_null

      - name: occupancy_rate_pct
        tests:
          - not_null